[package]
name = "agent-illustrator-wasm"
version = "0.1.0"
edition = "2021"
description = "WebAssembly build of Agent Illustrator, with a TypeScript API"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
agent-illustrator = { path = ".." }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
