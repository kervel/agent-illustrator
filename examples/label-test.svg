    --role-series-3: var(--secondary-3);
    --role-series-3-soft: #d5eee7;
    --role-series-4: var(--accent-2);
    --role-series-4-soft: #f4ddd3;
    --role-surface: var(--background-1);
    --role-surface-2: var(--background-2);
    --role-warn: var(--status-warning);
    --role-warn-soft: #fbead9;
    --secondary-1: #1D6E88;
    --secondary-2: #1F92A6;
    --secondary-3: #36b191;
