  <rect id="source" class="ai-shape ai-rect" x="0" y="272.5" width="80" height="30" fill="#f0f0f0" stroke="#333333" stroke-width="1.5"/>
  <rect id="target" class="ai-shape ai-rect" x="220" y="272.5" width="80" height="30" fill="#f0f0f0" stroke="#333333" stroke-width="1.5"/>
  <text class="ai-label" x="150" y="277.5" text-anchor="middle" dominant-baseline="middle" fill="var(--accent-1)" font-size="12"><tspan x="150" dy="-0"><tspan>Connection Label</tspan></tspan></text>
  <path class="ai-connection" d="M80 287.5 L212.8 287.5" fill="none" stroke="#333" stroke-width="2" marker-end="url(#ai-arrow)"/>
</svg>
