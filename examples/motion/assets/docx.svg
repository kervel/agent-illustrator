<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 126 162" width="126" height="162">
  <title>Document</title>
  <!-- Parts (ids) are addressable from AIL: d.sheet, d.fold, d.bars, d.bar1..bar6.
       Colours are theme roles; the CSS variables b1 to b6 are instance arguments.
       The sheet has its corner cut off, so the background shows behind the fold. -->
  <path id="sheet" d="M9.5 1.5 H94 L124.5 32 V152.5 a8 8 0 0 1 -8 8 H9.5 a8 8 0 0 1 -8 -8 V9.5 a8 8 0 0 1 8 -8 Z"
        fill="var(--role-surface, #ffffff)" stroke="var(--role-ink, #14171f)" stroke-width="3" stroke-linejoin="round"/>
  <g id="fold">
    <path d="M94 1.5 V26 a6 6 0 0 0 6 6 H124.5 Z" fill="var(--role-rule, #cbd1da)"/>
    <path d="M94 1.5 V26 a6 6 0 0 0 6 6 H124.5" fill="none" stroke="var(--role-ink, #14171f)"
          stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  </g>
  <g id="bars" stroke-width="9" stroke-linecap="round">
    <line id="bar1" x1="21.5" y1="44.5" x2="100.5" y2="44.5" stroke="var(--b1, var(--role-rule, #cbd1da))"/>
    <line id="bar2" x1="21.5" y1="65.5" x2="82.5" y2="65.5" stroke="var(--b2, var(--role-rule, #cbd1da))"/>
    <line id="bar3" x1="21.5" y1="86.5" x2="67.5" y2="86.5" stroke="var(--b3, var(--role-rule, #cbd1da))"/>
    <line id="bar4" x1="21.5" y1="107.5" x2="82.5" y2="107.5" stroke="var(--b4, var(--role-rule, #cbd1da))"/>
    <line id="bar5" x1="21.5" y1="128.5" x2="100.5" y2="128.5" stroke="var(--b5, var(--role-rule, #cbd1da))"/>
    <line id="bar6" x1="21.5" y1="149.5" x2="67.5" y2="149.5" stroke="var(--b6, var(--role-rule, #cbd1da))"/>
  </g>
</svg>
