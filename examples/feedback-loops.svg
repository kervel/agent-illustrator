        <rect id="result" class="ai-shape ai-rect" x="593.87" y="175" width="120" height="50" fill="var(--secondary-light)" stroke="var(--secondary-dark)" stroke-width="2"/>
        <text class="ai-label" x="653.87" y="200" text-anchor="middle" dominant-baseline="middle"><tspan x="653.87" dy="-0"><tspan>Result</tspan></tspan></text>
