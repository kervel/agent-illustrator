    --background-light: #ffffff;
    --foreground-1: #333333;
    --foreground-2: #666666;
    --foreground-3: #999999;
    --foreground-dark: #1a1a1a;
    --foreground-light: #e0e0e0;
    --kpv-amber: #FFB31B;
    --kpv-burgundy: #5a322b;
    --secondary-1: #ff9800;
    --secondary-2: #fff3e0;
    --secondary-3: #ffe0b2;
    --secondary-dark: #e65100;
    --secondary-light: #fff3e0;
    --status-error: #f44336;
    --status-success: #4caf50;
    --status-warning: #ff9800;
