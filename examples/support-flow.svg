<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-55 -39 1028 184" font-size="14">
  <!-- agent-illustrator dev -->
  <style><![CDATA[
    :root {
    --accent-1: #ba2415;
    --accent-2: #D4734F;
    --accent-3: #dd977a;
    --accent-dark: #901C1D;
    --accent-light: #e2d7cd;
    --background-1: #ffffff;
    --background-2: #ececec;
    --background-3: #e2d7cd;
    --background-dark: #484847;
    --background-light: #ffffff;
    --code-add: var(--role-ok);
    --code-add-bg: var(--role-ok-soft);
    --code-add-strong: var(--role-ok);
    --code-bg: var(--role-surface);
    --code-comment: var(--role-muted);
    --code-del: var(--role-error);
    --code-del-bg: var(--role-error-soft);
    --code-del-strong: var(--role-error);
    --code-frame: var(--role-ink);
    --code-function: var(--role-ink);
    --code-key: var(--role-primary);
    --code-keyword: var(--role-primary);
    --code-ln: var(--role-muted);
    --code-mark-bg: var(--role-warn-soft);
    --code-number: var(--role-ink);
    --code-plain: var(--role-ink);
    --code-string: var(--role-ok);
    --code-title: var(--role-ink);
    --code-title-bg: var(--role-surface-2);
    --foreground-1: #484847;
    --foreground-2: #818281;
    --foreground-3: #bfc0c0;
    --foreground-dark: #000000;
    --foreground-light: #ececec;
    --kpv-amber: #FFB31B;
    --kpv-burgundy: #5a322b;
    --role-backdrop: var(--background-2);
    --role-error: var(--status-error);
    --role-error-soft: #f6dedb;
    --role-ink: var(--text-1);
    --role-muted: var(--text-2);
    --role-ok: var(--status-success);
    --role-ok-soft: #e3f3e8;
    --role-primary: var(--secondary-1);
    --role-rule: var(--foreground-3);
    --role-secondary: var(--accent-1);
    --role-series-1: var(--secondary-2);
    --role-series-1-soft: #d2e9ee;
    --role-series-2: var(--status-warning);
    --role-series-2-soft: #f8e2cf;
    --role-series-3: var(--secondary-3);
    --role-series-3-soft: #d5eee7;
    --role-series-4: var(--accent-2);
    --role-series-4-soft: #f4ddd3;
    --role-surface: var(--background-1);
    --role-surface-2: var(--background-2);
    --role-warn: var(--status-warning);
    --role-warn-soft: #fbead9;
    --secondary-1: #1D6E88;
    --secondary-2: #1F92A6;
    --secondary-3: #36b191;
    --secondary-dark: #1D6E88;
    --secondary-light: #ececec;
    --status-error: #ba2415;
    --status-success: #1E9F49;
    --status-warning: #DD8028;
    --text-1: #484847;
    --text-2: #818281;
    --text-3: #bfc0c0;
    --text-dark: #484847;
    --text-light: #ffffff;
  }
  .ai-on-dark { fill: var(--text-light); }
    
/* stylesheets/kapernikov.css */
/* Kapernikov Brand Stylesheet for Agent Illustrator
   Colors from kapernikov-theme.css (huisstijlgids v4)
*/

:root {
  /* Foreground colors (lines, primary visual elements) */
  --foreground-1: #484847;       /* Dark grey */
  --foreground-2: #818281;       /* Medium grey */
  --foreground-3: #bfc0c0;       /* Light grey */
  --foreground-light: #ececec;   /* Very light grey */
  --foreground-dark: #000000;    /* Black */

  /* Background colors */
  --background-1: #ffffff;       /* White */
  --background-2: #ececec;       /* Very light grey */
  --background-3: #e2d7cd;       /* Beige */
  --background-light: #ffffff;
  --background-dark: #484847;    /* Dark grey */

  /* Text colors */
  --text-1: #484847;
  --text-2: #818281;
  --text-3: #bfc0c0;
  --text-light: #ffffff;
  --text-dark: #484847;

  /* Accent colors (brand red family) */
  --accent-1: #ba2415;           /* Primary brand red */
  --accent-2: #D4734F;           /* Red light */
  --accent-3: #dd977a;           /* Red lighter */
  --accent-light: #e2d7cd;       /* Beige (warm light fill) */
  --accent-dark: #901C1D;        /* Crimson */

  /* Secondary colors (cool teal/petrol) */
  --secondary-1: #1D6E88;        /* Petrol */
  --secondary-2: #1F92A6;        /* Cyan */
  --secondary-3: #36b191;        /* Jade */
  --secondary-light: #ececec;    /* Very light grey */
  --secondary-dark: #1D6E88;     /* Petrol */

  /* Extra brand colors (not in standard token set) */
  --kpv-burgundy: #5a322b;
  --kpv-amber: #FFB31B;

  /* Status colors */
  --status-success: #1E9F49;     /* Emerald */
  --status-warning: #DD8028;     /* Tangerine */
  --status-error: #ba2415;       /* Brand red */

  /* Roles: what a colour is for (reusable scenes and ail:motion libraries
     use only these). The line colours are petrol and brand red. */
  --role-primary: var(--secondary-1);
  --role-secondary: var(--accent-1);
  --role-ink: var(--text-1);
  --role-muted: var(--text-2);
  --role-rule: var(--foreground-3);
  --role-surface: var(--background-1);
  --role-surface-2: var(--background-2);
  --role-backdrop: var(--background-2);
  --role-ok: var(--status-success);
  --role-error: var(--status-error);
  --role-warn: var(--status-warning);
  --role-ok-soft: #e3f3e8;
  --role-error-soft: #f6dedb;
  --role-warn-soft: #fbead9;
  --role-series-1: var(--secondary-2);
  --role-series-2: var(--status-warning);
  --role-series-3: var(--secondary-3);
  --role-series-4: var(--accent-2);
  --role-series-1-soft: #d2e9ee;
  --role-series-2-soft: #f8e2cf;
  --role-series-3-soft: #d5eee7;
  --role-series-4-soft: #f4ddd3;
}

/* Typography */
.ai-label, .ai-text {
  font-family: 'Avenir LT Std', 'Avenir', 'Segoe UI', Roboto, Arial, sans-serif;
}

/* Shape defaults: rounded corners, softer stroke */
.ai-rect {
  rx: 4;
  ry: 4;
}

/* Opt-out for schematics / electronic symbols */
.schematic .ai-rect {
  rx: 0;
  ry: 0;
}

/* White labels on dark fills (adjacent sibling only) */
[fill="var(--accent-1)"] + .ai-label,
[fill="var(--accent-dark)"] + .ai-label,
[fill="var(--secondary-1)"] + .ai-label,
[fill="var(--secondary-2)"] + .ai-label,
[fill="var(--secondary-3)"] + .ai-label,
[fill="var(--secondary-dark)"] + .ai-label,
[fill="var(--foreground-1)"] + .ai-label,
[fill="var(--foreground-dark)"] + .ai-label {
  fill: var(--text-light);
}
  ]]></style>
  <defs>
    <marker id="ai-arrow" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="4" markerHeight="4" markerUnits="strokeWidth" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="context-stroke"/>
    </marker>
  </defs>
  <g id="flow" class="ai-container">
    <rect id="st_receive" class="ai-shape ai-rect" x="5" y="21" width="150" height="64" fill="var(--role-surface-2)" stroke="#333333" stroke-width="1.5"/>
    <text class="ai-label" x="80" y="53" text-anchor="middle" dominant-baseline="middle" font-size="12"><tspan x="80" dy="-7.5"><tspan font-weight="bold">Receive</tspan></tspan><tspan x="80" dy="15"><tspan>mail gateway</tspan></tspan></text>
    <g id="st_classify" class="ai-container">
      <rect id="st_classify_box" class="ai-shape ai-rect" x="191" y="21" width="150" height="64" fill="var(--role-surface-2)" stroke="#333333" stroke-width="1.5"/>
      <text class="ai-label" x="266" y="53" text-anchor="middle" dominant-baseline="middle" font-size="12"><tspan x="266" dy="-7.5"><tspan font-weight="bold">Classify</tspan></tspan><tspan x="266" dy="15"><tspan>triage agent</tspan></tspan></text>
      <rect id="st_classify_badge" class="ai-shape ai-rect" x="305" y="27" width="30" height="18" fill="var(--role-primary)" stroke="none" stroke-width="1.5" rx="9" style="rx:9px;ry:9px"/>
      <text class="ai-label" x="320" y="36" text-anchor="middle" dominant-baseline="middle" font-size="10" fill="var(--role-surface)" style="font-weight:bold"><tspan x="320" dy="-0"><tspan>AI</tspan></tspan></text>
    </g>
    <rect id="gate_classify" class="ai-shape ai-rect" x="377" y="39" width="64" height="28" fill="var(--role-warn-soft)" stroke="var(--role-warn)" stroke-width="1.5" rx="14" style="rx:14px;ry:14px"/>
    <text class="ai-label" x="409" y="53" text-anchor="middle" dominant-baseline="middle" font-size="11"><tspan x="409" dy="-0"><tspan>review</tspan></tspan></text>
    <g id="st_draft" class="ai-container">
      <rect id="st_draft_box" class="ai-shape ai-rect" x="477" y="21" width="150" height="64" fill="var(--role-surface-2)" stroke="#333333" stroke-width="1.5"/>
      <text class="ai-label" x="552" y="53" text-anchor="middle" dominant-baseline="middle" font-size="12"><tspan x="552" dy="-7.5"><tspan font-weight="bold">Draft reply</tspan></tspan><tspan x="552" dy="15"><tspan>support agent</tspan></tspan></text>
      <rect id="st_draft_badge" class="ai-shape ai-rect" x="591" y="27" width="30" height="18" fill="var(--role-primary)" stroke="none" stroke-width="1.5" rx="9" style="rx:9px;ry:9px"/>
      <text class="ai-label" x="606" y="36" text-anchor="middle" dominant-baseline="middle" font-size="10" fill="var(--role-surface)" style="font-weight:bold"><tspan x="606" dy="-0"><tspan>AI</tspan></tspan></text>
    </g>
    <rect id="gate_draft" class="ai-shape ai-rect" x="663" y="39" width="64" height="28" fill="var(--role-warn-soft)" stroke="var(--role-warn)" stroke-width="1.5" rx="14" style="rx:14px;ry:14px"/>
    <text class="ai-label" x="695" y="53" text-anchor="middle" dominant-baseline="middle" font-size="11"><tspan x="695" dy="-0"><tspan>review</tspan></tspan></text>
    <rect id="st_send" class="ai-shape ai-rect" x="763" y="21" width="150" height="64" fill="var(--role-surface-2)" stroke="#333333" stroke-width="1.5"/>
    <text class="ai-label" x="838" y="53" text-anchor="middle" dominant-baseline="middle" font-size="12"><tspan x="838" dy="-7.5"><tspan font-weight="bold">Send</tspan></tspan><tspan x="838" dy="15"><tspan>helpdesk</tspan></tspan></text>
  </g>
  <path class="ai-connection" d="M155 53 L183.8 53" fill="none" stroke="#333" stroke-width="2" marker-end="url(#ai-arrow)"/>
  <path class="ai-connection" d="M341 53 L369.8 53" fill="none" stroke="#333" stroke-width="2" marker-end="url(#ai-arrow)"/>
  <path class="ai-connection" d="M441 53 L469.8 53" fill="none" stroke="#333" stroke-width="2" marker-end="url(#ai-arrow)"/>
  <path class="ai-connection" d="M627 53 L655.8 53" fill="none" stroke="#333" stroke-width="2" marker-end="url(#ai-arrow)"/>
  <path class="ai-connection" d="M727 53 L755.8 53" fill="none" stroke="#333" stroke-width="2" marker-end="url(#ai-arrow)"/>
</svg>
