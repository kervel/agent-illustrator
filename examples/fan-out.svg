<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 19 585 330" font-size="14">
  <!-- agent-illustrator dev -->
  <style><![CDATA[
    :root {
    --accent-1: #ba2415;
    --accent-2: #D4734F;
    --accent-3: #dd977a;
    --accent-dark: #901C1D;
    --accent-light: #e2d7cd;
    --background-1: #ffffff;
    --background-2: #ececec;
    --background-3: #e2d7cd;
    --background-dark: #484847;
    --background-light: #ffffff;
    --code-add: var(--role-ok);
    --code-add-bg: var(--role-ok-soft);
    --code-add-strong: var(--role-ok);
    --code-bg: var(--role-surface);
    --code-comment: var(--role-muted);
    --code-del: var(--role-error);
    --code-del-bg: var(--role-error-soft);
    --code-del-strong: var(--role-error);
    --code-frame: var(--role-ink);
    --code-function: var(--role-ink);
    --code-key: var(--role-primary);
    --code-keyword: var(--role-primary);
    --code-ln: var(--role-muted);
    --code-mark-bg: var(--role-warn-soft);
    --code-number: var(--role-ink);
    --code-plain: var(--role-ink);
    --code-string: var(--role-ok);
    --code-title: var(--role-ink);
    --code-title-bg: var(--role-surface-2);
    --foreground-1: #484847;
    --foreground-2: #818281;
    --foreground-3: #bfc0c0;
    --foreground-dark: #000000;
    --foreground-light: #ececec;
    --kpv-amber: #FFB31B;
    --kpv-burgundy: #5a322b;
    --role-backdrop: var(--background-2);
    --role-error: var(--status-error);
    --role-error-soft: #f6dedb;
    --role-ink: var(--text-1);
    --role-muted: var(--text-2);
    --role-ok: var(--status-success);
    --role-ok-soft: #e3f3e8;
    --role-primary: var(--secondary-1);
    --role-rule: var(--foreground-3);
    --role-secondary: var(--accent-1);
    --role-series-1: var(--secondary-2);
    --role-series-1-soft: #d2e9ee;
    --role-series-2: var(--status-warning);
    --role-series-2-soft: #f8e2cf;
    --role-series-3: var(--secondary-3);
    --role-series-3-soft: #d5eee7;
    --role-series-4: var(--accent-2);
    --role-series-4-soft: #f4ddd3;
    --role-surface: var(--background-1);
    --role-surface-2: var(--background-2);
    --role-warn: var(--status-warning);
    --role-warn-soft: #fbead9;
    --secondary-1: #1D6E88;
    --secondary-2: #1F92A6;
    --secondary-3: #36b191;
    --secondary-dark: #1D6E88;
    --secondary-light: #ececec;
    --status-error: #ba2415;
    --status-success: #1E9F49;
    --status-warning: #DD8028;
    --text-1: #484847;
    --text-2: #818281;
    --text-3: #bfc0c0;
    --text-dark: #484847;
    --text-light: #ffffff;
  }
  .ai-on-dark { fill: var(--text-light); }
    
/* stylesheets/kapernikov.css */
/* Kapernikov Brand Stylesheet for Agent Illustrator
   Colors from kapernikov-theme.css (huisstijlgids v4)
*/

:root {
  /* Foreground colors (lines, primary visual elements) */
  --foreground-1: #484847;       /* Dark grey */
  --foreground-2: #818281;       /* Medium grey */
  --foreground-3: #bfc0c0;       /* Light grey */
  --foreground-light: #ececec;   /* Very light grey */
  --foreground-dark: #000000;    /* Black */

  /* Background colors */
  --background-1: #ffffff;       /* White */
  --background-2: #ececec;       /* Very light grey */
  --background-3: #e2d7cd;       /* Beige */
  --background-light: #ffffff;
  --background-dark: #484847;    /* Dark grey */

  /* Text colors */
  --text-1: #484847;
  --text-2: #818281;
  --text-3: #bfc0c0;
  --text-light: #ffffff;
  --text-dark: #484847;

  /* Accent colors (brand red family) */
  --accent-1: #ba2415;           /* Primary brand red */
  --accent-2: #D4734F;           /* Red light */
  --accent-3: #dd977a;           /* Red lighter */
  --accent-light: #e2d7cd;       /* Beige (warm light fill) */
  --accent-dark: #901C1D;        /* Crimson */

  /* Secondary colors (cool teal/petrol) */
  --secondary-1: #1D6E88;        /* Petrol */
  --secondary-2: #1F92A6;        /* Cyan */
  --secondary-3: #36b191;        /* Jade */
  --secondary-light: #ececec;    /* Very light grey */
  --secondary-dark: #1D6E88;     /* Petrol */

  /* Extra brand colors (not in standard token set) */
  --kpv-burgundy: #5a322b;
  --kpv-amber: #FFB31B;

  /* Status colors */
  --status-success: #1E9F49;     /* Emerald */
  --status-warning: #DD8028;     /* Tangerine */
  --status-error: #ba2415;       /* Brand red */

  /* Roles: what a colour is for (reusable scenes and ail:motion libraries
     use only these). The line colours are petrol and brand red. */
  --role-primary: var(--secondary-1);
  --role-secondary: var(--accent-1);
  --role-ink: var(--text-1);
  --role-muted: var(--text-2);
  --role-rule: var(--foreground-3);
  --role-surface: var(--background-1);
  --role-surface-2: var(--background-2);
  --role-backdrop: var(--background-2);
  --role-ok: var(--status-success);
  --role-error: var(--status-error);
  --role-warn: var(--status-warning);
  --role-ok-soft: #e3f3e8;
  --role-error-soft: #f6dedb;
  --role-warn-soft: #fbead9;
  --role-series-1: var(--secondary-2);
  --role-series-2: var(--status-warning);
  --role-series-3: var(--secondary-3);
  --role-series-4: var(--accent-2);
  --role-series-1-soft: #d2e9ee;
  --role-series-2-soft: #f8e2cf;
  --role-series-3-soft: #d5eee7;
  --role-series-4-soft: #f4ddd3;
}

/* Typography */
.ai-label, .ai-text {
  font-family: 'Avenir LT Std', 'Avenir', 'Segoe UI', Roboto, Arial, sans-serif;
}

/* Shape defaults: rounded corners, softer stroke */
.ai-rect {
  rx: 4;
  ry: 4;
}

/* Opt-out for schematics / electronic symbols */
.schematic .ai-rect {
  rx: 0;
  ry: 0;
}

/* White labels on dark fills (adjacent sibling only) */
[fill="var(--accent-1)"] + .ai-label,
[fill="var(--accent-dark)"] + .ai-label,
[fill="var(--secondary-1)"] + .ai-label,
[fill="var(--secondary-2)"] + .ai-label,
[fill="var(--secondary-3)"] + .ai-label,
[fill="var(--secondary-dark)"] + .ai-label,
[fill="var(--foreground-1)"] + .ai-label,
[fill="var(--foreground-dark)"] + .ai-label {
  fill: var(--text-light);
}
  ]]></style>
  <defs>
    <marker id="ai-arrow" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="4" markerHeight="4" markerUnits="strokeWidth" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="context-stroke"/>
    </marker>
    <marker id="ai-end-open" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6.5" markerHeight="6.5" markerUnits="strokeWidth" orient="auto-start-reverse" overflow="visible">
      <path d="M0,1.12 L7.76,5 L0,8.88" fill="none" stroke="context-stroke" stroke-width="1.54" stroke-linejoin="miter"/>
    </marker>
  </defs>
  <rect id="srv" class="ai-shape ai-rect" x="0" y="149" width="130" height="70" fill="var(--role-primary)" stroke="#333333" stroke-width="1.5"/>
  <text class="ai-label" x="65" y="184" text-anchor="middle" dominant-baseline="middle" fill="var(--role-surface)"><tspan x="65" dy="-0"><tspan>Server</tspan></tspan></text>
  <g id="clients" class="ai-container">
    <rect id="c1" class="ai-shape ai-rect" x="335" y="79" width="130" height="44" fill="var(--role-ok-soft)" stroke="#333333" stroke-width="1.5"/>
    <text class="ai-label" x="400" y="101" text-anchor="middle" dominant-baseline="middle"><tspan x="400" dy="-0"><tspan>Client 1</tspan></tspan></text>
    <rect id="c2" class="ai-shape ai-rect" x="335" y="157" width="130" height="54" fill="var(--role-error-soft)" stroke="var(--role-error)" stroke-width="2"/>
    <text class="ai-label" x="400" y="184" text-anchor="middle" dominant-baseline="middle"><tspan x="400" dy="-8.75"><tspan>Client 2</tspan></tspan><tspan x="400" dy="17.5"><tspan font-style="italic">timeout</tspan></tspan></text>
    <rect id="c3" class="ai-shape ai-rect" x="335" y="245" width="130" height="44" fill="var(--role-ok-soft)" stroke="#333333" stroke-width="1.5"/>
    <text class="ai-label" x="400" y="267" text-anchor="middle" dominant-baseline="middle"><tspan x="400" dy="-0"><tspan>Client 3</tspan></tspan></text>
  </g>
  <text class="ai-label" x="228.7471" y="133.2309" text-anchor="middle" dominant-baseline="middle" fill="var(--text-2)" font-size="12"><tspan x="228.7471" dy="-0"><tspan>data</tspan></tspan></text>
  <text class="ai-label" x="236.2529" y="216.2309" text-anchor="middle" dominant-baseline="middle" fill="var(--text-2)" font-size="12"><tspan x="236.2529" dy="-0"><tspan>data</tspan></tspan></text>
  <text class="ai-label" x="232.5" y="174" text-anchor="middle" dominant-baseline="middle" fill="var(--text-2)" font-size="12"><tspan x="232.5" dy="-0"><tspan>no reply</tspan></tspan></text>
  <path class="ai-connection" d="M130 184 L328.32625255070525 103.70205384532423" fill="none" stroke="var(--role-ok)" stroke-width="2" marker-end="url(#ai-arrow)"/>
  <path class="ai-connection" d="M130 184 L328.32625255070525 264.2979461546758" fill="none" stroke="var(--role-ok)" stroke-width="2" marker-end="url(#ai-arrow)"/>
  <path class="ai-connection" d="M130 184 L335 184" fill="none" stroke="var(--role-error)" stroke-width="2" stroke-dasharray="8,4" marker-end="url(#ai-end-open)"/>
</svg>
