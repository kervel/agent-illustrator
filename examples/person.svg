        <path id="alice_hair" class="ai-shape ai-path" d="M14.00 35.00 A9.00 9.00 0 0 1 32.00 35.00 L32.00 35.00 L27.00 33.00 L23.00 35.00 L20.00 34.00 L14.00 35.00 Z"  fill="#2b1b0e" stroke="#333333" stroke-width="1.5"/>
      </g>
      <path id="alice_torso" class="ai-shape ai-path" d="M10.00 57.00 A13.00 13.00 0 0 1 36.00 57.00 L36.00 65.00 L10.00 65.00 Z"  fill="#4a6fa5" stroke="#333" stroke-width="1"/>
      <path id="alice_collar" class="ai-shape ai-path" d="M20.00 44.33 A14.00 14.00 0 0 1 26.00 44.33 L23.00 50.33 Z"  fill="#ffffff" stroke="none" stroke-width="1.5"/>
    </g>
  </g>
  <g id="bob" class="ai-container">
    <g class="ai-container">
      <g id="bob_head_stack" class="ai-container">
        <circle id="bob_head" class="ai-shape ai-circle" cx="139" cy="35" r="9" fill="#f2c9a0" stroke="#333" stroke-width="1"/>
        <path id="bob_hair" class="ai-shape ai-path" d="M130.00 35.00 A9.00 9.00 0 0 1 148.00 35.00 L148.00 35.00 L143.00 33.00 L139.00 35.00 L136.00 34.00 L130.00 35.00 Z"  fill="#2b1b0e" stroke="#333333" stroke-width="1.5"/>
      </g>
      <path id="bob_torso" class="ai-shape ai-path" d="M126.00 57.00 A13.00 13.00 0 0 1 152.00 57.00 L152.00 65.00 L126.00 65.00 Z"  fill="#4a6fa5" stroke="#333" stroke-width="1"/>
      <path id="bob_collar" class="ai-shape ai-path" d="M136.00 44.33 A14.00 14.00 0 0 1 142.00 44.33 L139.00 50.33 Z"  fill="#ffffff" stroke="none" stroke-width="1.5"/>
    </g>
  </g>
  <circle id="bottom_via" class="ai-shape ai-circle" cx="81" cy="100" r="0.5" fill="none" stroke="none" stroke-width="1.5"/>
  <circle id="top_via" class="ai-shape ai-circle" cx="81" cy="-9" r="0.5" fill="none" stroke="none" stroke-width="1.5"/>
  <text class="ai-label" x="81" y="90" text-anchor="middle" dominant-baseline="middle" fill="var(--text-2)" font-size="12"><tspan x="81" dy="-0"><tspan>request</tspan></tspan></text>
  <text class="ai-label" x="81" y="1" text-anchor="middle" dominant-baseline="middle" fill="var(--text-2)" font-size="12"><tspan x="81" dy="-0"><tspan>response</tspan></tspan></text>
  <path class="ai-connection" d="M23 69 C23 90.92157739660985 59.07842260339015 100 81 100 C102.92157739660985 100 139 90.92157739660985 139 76.2" fill="none" stroke="#e65100" stroke-width="2" marker-end="url(#ai-arrow)"/>
  <path class="ai-connection" d="M139 22 C139 0.07842260339015539 102.92157739660985 -9 81 -9 C59.07842260339015 -9 22.999999999999996 0.07842260339015539 23 14.8" fill="none" stroke="#1565c0" stroke-width="2" marker-end="url(#ai-arrow)"/>
</svg>
