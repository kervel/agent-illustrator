<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-55 -55 844.23 606.5" font-size="14">
  <!-- agent-illustrator dev -->
  <style><![CDATA[
    :root {
    --accent-1: #ba2415;
    --accent-2: #D4734F;
    --accent-3: #dd977a;
    --accent-dark: #901C1D;
    --accent-light: #e2d7cd;
    --background-1: #ffffff;
    --background-2: #ececec;
    --background-3: #e2d7cd;
    --background-dark: #484847;
    --background-light: #ffffff;
    --code-add: var(--role-ok);
    --code-add-bg: var(--role-ok-soft);
    --code-add-strong: var(--role-ok);
    --code-bg: var(--role-surface);
    --code-comment: var(--role-muted);
    --code-del: var(--role-error);
    --code-del-bg: var(--role-error-soft);
    --code-del-strong: var(--role-error);
    --code-frame: var(--role-ink);
    --code-function: var(--role-ink);
    --code-key: var(--role-primary);
    --code-keyword: var(--role-primary);
    --code-ln: var(--role-muted);
    --code-mark-bg: var(--role-warn-soft);
    --code-number: var(--role-ink);
    --code-plain: var(--role-ink);
    --code-string: var(--role-ok);
    --code-title: var(--role-ink);
    --code-title-bg: var(--role-surface-2);
    --foreground-1: #484847;
    --foreground-2: #818281;
    --foreground-3: #bfc0c0;
    --foreground-dark: #000000;
    --foreground-light: #ececec;
    --kpv-amber: #FFB31B;
    --kpv-burgundy: #5a322b;
    --role-backdrop: var(--background-2);
    --role-error: var(--status-error);
    --role-error-soft: #f6dedb;
    --role-ink: var(--text-1);
    --role-muted: var(--text-2);
    --role-ok: var(--status-success);
    --role-ok-soft: #e3f3e8;
    --role-primary: var(--secondary-1);
    --role-rule: var(--foreground-3);
    --role-secondary: var(--accent-1);
    --role-series-1: var(--secondary-2);
    --role-series-1-soft: #d2e9ee;
    --role-series-2: var(--status-warning);
    --role-series-2-soft: #f8e2cf;
    --role-series-3: var(--secondary-3);
    --role-series-3-soft: #d5eee7;
    --role-series-4: var(--accent-2);
    --role-series-4-soft: #f4ddd3;
    --role-surface: var(--background-1);
    --role-surface-2: var(--background-2);
    --role-warn: var(--status-warning);
    --role-warn-soft: #fbead9;
    --secondary-1: #1D6E88;
    --secondary-2: #1F92A6;
    --secondary-3: #36b191;
    --secondary-dark: #1D6E88;
    --secondary-light: #ececec;
    --status-error: #ba2415;
    --status-success: #1E9F49;
    --status-warning: #DD8028;
    --text-1: #484847;
    --text-2: #818281;
    --text-3: #bfc0c0;
    --text-dark: #484847;
    --text-light: #ffffff;
  }
  .ai-on-dark { fill: var(--text-light); }
    
/* /home/kervel/projects/agent-illustrator/examples/../stylesheets/kapernikov.css */
/* Kapernikov Brand Stylesheet for Agent Illustrator
   Colors from kapernikov-theme.css (huisstijlgids v4)
*/

:root {
  /* Foreground colors (lines, primary visual elements) */
  --foreground-1: #484847;       /* Dark grey */
  --foreground-2: #818281;       /* Medium grey */
  --foreground-3: #bfc0c0;       /* Light grey */
  --foreground-light: #ececec;   /* Very light grey */
  --foreground-dark: #000000;    /* Black */

  /* Background colors */
  --background-1: #ffffff;       /* White */
  --background-2: #ececec;       /* Very light grey */
  --background-3: #e2d7cd;       /* Beige */
  --background-light: #ffffff;
  --background-dark: #484847;    /* Dark grey */

  /* Text colors */
  --text-1: #484847;
  --text-2: #818281;
  --text-3: #bfc0c0;
  --text-light: #ffffff;
  --text-dark: #484847;

  /* Accent colors (brand red family) */
  --accent-1: #ba2415;           /* Primary brand red */
  --accent-2: #D4734F;           /* Red light */
  --accent-3: #dd977a;           /* Red lighter */
  --accent-light: #e2d7cd;       /* Beige (warm light fill) */
  --accent-dark: #901C1D;        /* Crimson */

  /* Secondary colors (cool teal/petrol) */
  --secondary-1: #1D6E88;        /* Petrol */
  --secondary-2: #1F92A6;        /* Cyan */
  --secondary-3: #36b191;        /* Jade */
  --secondary-light: #ececec;    /* Very light grey */
  --secondary-dark: #1D6E88;     /* Petrol */

  /* Extra brand colors (not in standard token set) */
  --kpv-burgundy: #5a322b;
  --kpv-amber: #FFB31B;

  /* Status colors */
  --status-success: #1E9F49;     /* Emerald */
  --status-warning: #DD8028;     /* Tangerine */
  --status-error: #ba2415;       /* Brand red */

  /* Roles: what a colour is for (reusable scenes and ail:motion libraries
     use only these). The line colours are petrol and brand red. */
  --role-primary: var(--secondary-1);
  --role-secondary: var(--accent-1);
  --role-ink: var(--text-1);
  --role-muted: var(--text-2);
  --role-rule: var(--foreground-3);
  --role-surface: var(--background-1);
  --role-surface-2: var(--background-2);
  --role-backdrop: var(--background-2);
  --role-ok: var(--status-success);
  --role-error: var(--status-error);
  --role-warn: var(--status-warning);
  --role-ok-soft: #e3f3e8;
  --role-error-soft: #f6dedb;
  --role-warn-soft: #fbead9;
  --role-series-1: var(--secondary-2);
  --role-series-2: var(--status-warning);
  --role-series-3: var(--secondary-3);
  --role-series-4: var(--accent-2);
  --role-series-1-soft: #d2e9ee;
  --role-series-2-soft: #f8e2cf;
  --role-series-3-soft: #d5eee7;
  --role-series-4-soft: #f4ddd3;
}

/* Typography */
.ai-label, .ai-text {
  font-family: 'Avenir LT Std', 'Avenir', 'Segoe UI', Roboto, Arial, sans-serif;
}

/* Shape defaults: rounded corners, softer stroke */
.ai-rect {
  rx: 4;
  ry: 4;
}

/* Opt-out for schematics / electronic symbols */
.schematic .ai-rect {
  rx: 0;
  ry: 0;
}

/* White labels on dark fills (adjacent sibling only) */
[fill="var(--accent-1)"] + .ai-label,
[fill="var(--accent-dark)"] + .ai-label,
[fill="var(--secondary-1)"] + .ai-label,
[fill="var(--secondary-2)"] + .ai-label,
[fill="var(--secondary-3)"] + .ai-label,
[fill="var(--secondary-dark)"] + .ai-label,
[fill="var(--foreground-1)"] + .ai-label,
[fill="var(--foreground-dark)"] + .ai-label {
  fill: var(--text-light);
}
  ]]></style>
  <g id="sheet" class="ai-container">
    <text id="heading" class="ai-shape ai-text" x="5" y="14" text-anchor="start" dominant-baseline="middle" font-size="18" fill="var(--foreground-1)">Labels on boxes</text>
    <g id="placements" class="ai-container">
      <rect id="p_in" class="ai-shape ai-rect" x="10" y="72" width="110" height="54" fill="var(--accent-light)" stroke="var(--accent-dark)" stroke-width="2"/>
      <text class="ai-label" x="65" y="99" text-anchor="middle" dominant-baseline="middle"><tspan x="65" dy="-0"><tspan>inside</tspan></tspan></text>
      <rect id="p_above" class="ai-shape ai-rect" x="154" y="72" width="110" height="54" fill="var(--accent-light)" stroke="var(--accent-dark)" stroke-width="2"/>
      <text class="ai-label" x="209" y="57.25" text-anchor="middle" dominant-baseline="middle"><tspan x="209" dy="-0"><tspan>above</tspan></tspan></text>
      <rect id="p_below" class="ai-shape ai-rect" x="298" y="72" width="110" height="54" fill="var(--accent-light)" stroke="var(--accent-dark)" stroke-width="2"/>
      <text class="ai-label" x="353" y="140.75" text-anchor="middle" dominant-baseline="middle"><tspan x="353" dy="-0"><tspan>below</tspan></tspan></text>
      <rect id="p_left" class="ai-shape ai-rect" x="442" y="72" width="110" height="54" fill="var(--accent-light)" stroke="var(--accent-dark)" stroke-width="2"/>
      <text class="ai-label" x="436" y="99" text-anchor="end" dominant-baseline="middle"><tspan x="436" dy="-0"><tspan>left</tspan></tspan></text>
      <rect id="p_right" class="ai-shape ai-rect" x="586" y="72" width="110" height="54" fill="var(--accent-light)" stroke="var(--accent-dark)" stroke-width="2"/>
      <text class="ai-label" x="702" y="99" text-anchor="start" dominant-baseline="middle"><tspan x="702" dy="-0"><tspan>right</tspan></tspan></text>
    </g>
    <g id="alignments" class="ai-container">
      <rect id="a_start" class="ai-shape ai-rect" x="10" y="180" width="170" height="54" fill="var(--secondary-light)" stroke="var(--secondary-dark)" stroke-width="2"/>
      <text class="ai-label" x="10" y="248.75" text-anchor="start" dominant-baseline="middle"><tspan x="10" dy="-0"><tspan>below, start</tspan></tspan></text>
      <rect id="a_mid" class="ai-shape ai-rect" x="214" y="180" width="170" height="54" fill="var(--secondary-light)" stroke="var(--secondary-dark)" stroke-width="2"/>
      <text class="ai-label" x="299" y="248.75" text-anchor="middle" dominant-baseline="middle"><tspan x="299" dy="-0"><tspan>below, center</tspan></tspan></text>
      <rect id="a_end" class="ai-shape ai-rect" x="418" y="180" width="170" height="54" fill="var(--secondary-light)" stroke="var(--secondary-dark)" stroke-width="2"/>
      <text class="ai-label" x="588" y="248.75" text-anchor="end" dominant-baseline="middle"><tspan x="588" dy="-0"><tspan>below, end</tspan></tspan></text>
    </g>
    <g id="cards" class="ai-container">
      <rect id="card" class="ai-shape ai-rect" x="10" y="288" width="190.678" height="68.5" fill="var(--accent-light)" stroke="var(--accent-dark)" stroke-width="2"/>
      <text class="ai-label" x="105.339" y="322.25" text-anchor="middle" dominant-baseline="middle"><tspan x="105.339" dy="-17.5"><tspan font-weight="bold">changeset from INES</tspan></tspan><tspan x="105.339" dy="17.5"><tspan>temporal_mode = correction</tspan></tspan><tspan x="105.339" dy="17.5"><tspan font-size="11.200000000000001">V2 inherits its label from V1</tspan></tspan></text>
      <rect id="wrapped" class="ai-shape ai-rect" x="234.678" y="288" width="240" height="68.5" fill="var(--accent-light)" stroke="var(--accent-dark)" stroke-width="2"/>
      <text class="ai-label" x="354.678" y="322.25" text-anchor="middle" dominant-baseline="middle"><tspan x="354.678" dy="-17.5"><tspan>T &lt;= now confirmed_from &lt;= T &lt;</tspan></tspan><tspan x="354.678" dy="17.5"><tspan>confirmed_until, so the event is</tspan></tspan><tspan x="354.678" dy="17.5"><tspan>active</tspan></tspan></text>
    </g>
    <g id="captioned" class="ai-container">
      <rect id="bar" class="ai-shape ai-rect" x="10" y="410.5" width="220" height="48" fill="var(--secondary-light)" stroke="var(--secondary-dark)" stroke-width="2"/>
      <text class="ai-label" x="120" y="434.5" text-anchor="middle" dominant-baseline="middle"><tspan x="120" dy="-0"><tspan>V1</tspan></tspan></text>
      <rect id="bar2" class="ai-shape ai-rect" x="290" y="410.5" width="150" height="48" fill="var(--accent-light)" stroke="var(--accent-dark)" stroke-width="2"/>
      <text class="ai-label" x="365" y="434.5" text-anchor="middle" dominant-baseline="middle"><tspan x="365" dy="-0"><tspan>V2</tspan></tspan></text>
    </g>
    <text id="bar_state" class="ai-shape ai-text" x="230" y="470" text-anchor="end" dominant-baseline="middle" font-size="11" fill="var(--status-success)">confirmed</text>
    <text id="bar_note" class="ai-shape ai-text" x="230" y="486" text-anchor="end" dominant-baseline="middle" font-size="11" fill="var(--text-3)">supersedes V1</text>
    <text id="bar2_state" class="ai-shape ai-text" x="365" y="470" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="var(--status-warning)">planned</text>
  </g>
</svg>
