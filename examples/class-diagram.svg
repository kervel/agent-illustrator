        <rect id="entry_hd" class="ai-shape ai-rect" x="10" y="10" width="220" height="33.5" fill="var(--secondary-light)" stroke="var(--foreground-2)" stroke-width="1.5"/>
        <text class="ai-label" x="120" y="26.75" text-anchor="middle" dominant-baseline="middle" style="font-weight:bold"><tspan x="120" dy="-0"><tspan>TimeEntry</tspan></tspan></text>
        <rect id="entry_at" class="ai-shape ai-rect" x="10" y="43.5" width="220" height="61" fill="var(--background-1)" stroke="var(--foreground-2)" stroke-width="1.5"/>
        <text class="ai-label" x="18" y="74" text-anchor="start" dominant-baseline="middle" font-size="12"><tspan x="18" dy="-15"><tspan>date</tspan></tspan><tspan x="18" dy="15"><tspan>hours</tspan></tspan><tspan x="18" dy="15"><tspan>status</tspan></tspan></text>
        <rect id="entry_op" class="ai-shape ai-rect" x="10" y="104.5" width="220" height="31" fill="var(--background-1)" stroke="var(--foreground-2)" stroke-width="1.5"/>
