    <g id="invoice" class="ai-container">
      <g id="invoice_box" class="ai-container">
        <rect id="invoice_hd" class="ai-shape ai-rect" x="370" y="10" width="220" height="33.5" fill="var(--secondary-light)" stroke="var(--foreground-2)" stroke-width="1.5"/>
        <text class="ai-label" x="480" y="26.75" text-anchor="middle" dominant-baseline="middle" style="font-weight:bold"><tspan x="480" dy="-0"><tspan>Invoice</tspan></tspan></text>
        <rect id="invoice_at" class="ai-shape ai-rect" x="370" y="43.5" width="220" height="61" fill="var(--background-1)" stroke="var(--foreground-2)" stroke-width="1.5"/>
        <text class="ai-label" x="378" y="74" text-anchor="start" dominant-baseline="middle" font-size="12"><tspan x="378" dy="-15"><tspan>number</tspan></tspan><tspan x="378" dy="15"><tspan>total</tspan></tspan><tspan x="378" dy="15"><tspan>paid</tspan></tspan></text>
        <rect id="invoice_op" class="ai-shape ai-rect" x="370" y="104.5" width="220" height="31" fill="var(--background-1)" stroke="var(--foreground-2)" stroke-width="1.5"/>
        <text class="ai-label" x="378" y="120" text-anchor="start" dominant-baseline="middle" font-size="12"><tspan x="378" dy="-0"><tspan>+ pay()</tspan></tspan></text>
      </g>
    </g>
  </g>
  <text class="ai-label" x="300" y="82.75" text-anchor="middle" dominant-baseline="middle" fill="var(--text-2)" font-size="12"><tspan x="300" dy="-0"><tspan>billed on</tspan></tspan></text>
  <text class="ai-label" x="238.334" y="59.25" text-anchor="middle" dominant-baseline="middle" fill="var(--text-2)" font-size="12"><tspan x="238.334" dy="-0"><tspan>*</tspan></tspan></text>
  <text class="ai-label" x="353.992" y="59.25" text-anchor="middle" dominant-baseline="middle" fill="var(--text-2)" font-size="12"><tspan x="353.992" dy="-0"><tspan>0..1</tspan></tspan></text>
  <path class="ai-connection" d="M230 72.75 L370 72.75" fill="none" stroke="#333" stroke-width="2"/>
</svg>
