<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-45 -45 1060 557" font-size="14">
  <!-- agent-illustrator dev -->
  <style><![CDATA[
    :root {
    --accent-1: #ba2415;
    --accent-2: #D4734F;
    --accent-3: #dd977a;
    --accent-dark: #901C1D;
    --accent-light: #e2d7cd;
    --background-1: #ffffff;
    --background-2: #ececec;
    --background-3: #e2d7cd;
    --background-dark: #484847;
    --background-light: #ffffff;
    --code-add: var(--role-ok);
    --code-add-bg: var(--role-ok-soft);
    --code-add-strong: var(--role-ok);
    --code-bg: var(--role-surface);
    --code-comment: var(--role-muted);
    --code-del: var(--role-error);
    --code-del-bg: var(--role-error-soft);
    --code-del-strong: var(--role-error);
    --code-frame: var(--role-ink);
    --code-function: var(--role-ink);
    --code-key: var(--role-primary);
    --code-keyword: var(--role-primary);
    --code-ln: var(--role-muted);
    --code-mark-bg: var(--role-warn-soft);
    --code-number: var(--role-ink);
    --code-plain: var(--role-ink);
    --code-string: var(--role-ok);
    --code-title: var(--role-ink);
    --code-title-bg: var(--role-surface-2);
    --foreground-1: #484847;
    --foreground-2: #818281;
    --foreground-3: #bfc0c0;
    --foreground-dark: #000000;
    --foreground-light: #ececec;
    --kpv-amber: #FFB31B;
    --kpv-burgundy: #5a322b;
    --role-backdrop: var(--background-2);
    --role-error: var(--status-error);
    --role-error-soft: #f6dedb;
    --role-ink: var(--text-1);
    --role-muted: var(--text-2);
    --role-ok: var(--status-success);
    --role-ok-soft: #e3f3e8;
    --role-primary: var(--secondary-1);
    --role-rule: var(--foreground-3);
    --role-secondary: var(--accent-1);
    --role-series-1: var(--secondary-2);
    --role-series-1-soft: #d2e9ee;
    --role-series-2: var(--status-warning);
    --role-series-2-soft: #f8e2cf;
    --role-series-3: var(--secondary-3);
    --role-series-3-soft: #d5eee7;
    --role-series-4: var(--accent-2);
    --role-series-4-soft: #f4ddd3;
    --role-surface: var(--background-1);
    --role-surface-2: var(--background-2);
    --role-warn: var(--status-warning);
    --role-warn-soft: #fbead9;
    --secondary-1: #1D6E88;
    --secondary-2: #1F92A6;
    --secondary-3: #36b191;
    --secondary-dark: #1D6E88;
    --secondary-light: #ececec;
    --status-error: #ba2415;
    --status-success: #1E9F49;
    --status-warning: #DD8028;
