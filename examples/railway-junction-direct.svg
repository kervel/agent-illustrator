  <path class="ai-connection" d="M129.8851 67.9342 L223.08038768721167 47.6006083011338" fill="none" stroke="#228B22" stroke-width="2" marker-end="url(#ai-arrow)"/>
  <path class="ai-connection" d="M129.0787 120.1079 L225.04802694436106 52.0567924993216" fill="none" stroke="#228B22" stroke-width="2" marker-end="url(#ai-arrow)"/>
