<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-50 -73.5 350 261.5">
  <!-- agent-illustrator 0.1.26 -->
  <style>
    :root {
    --accent-1: #2196f3;
    --accent-2: #e3f2fd;
    --accent-3: #bbdefb;
    --accent-dark: #1565c0;
    --accent-light: #e3f2fd;
    --background-1: #ffffff;
    --background-2: #f5f5f5;
    --background-3: #eeeeee;
    --background-dark: #333333;
    --background-light: #ffffff;
    --foreground-1: #333333;
    --foreground-2: #666666;
    --foreground-3: #999999;
    --foreground-dark: #1a1a1a;
    --foreground-light: #e0e0e0;
    --secondary-1: #ff9800;
    --secondary-2: #fff3e0;
    --secondary-3: #ffe0b2;
    --secondary-dark: #e65100;
    --secondary-light: #fff3e0;
    --status-error: #f44336;
    --status-success: #4caf50;
    --status-warning: #ff9800;
    --text-1: #333333;
    --text-2: #666666;
    --text-3: #999999;
    --text-dark: #1a1a1a;
    --text-light: #ffffff;
  }

    /* Kapernikov Brand Stylesheet for Agent Illustrator
   Colors from kapernikov-theme.css (huisstijlgids v4)
*/

:root {
  /* Foreground colors (lines, primary visual elements) */
  --foreground-1: #484847;       /* Dark grey */
  --foreground-2: #818281;       /* Medium grey */
  --foreground-3: #bfc0c0;       /* Light grey */
  --foreground-light: #ececec;   /* Very light grey */
  --foreground-dark: #000000;    /* Black */

  /* Background colors */
  --background-1: #ffffff;       /* White */
  --background-2: #ececec;       /* Very light grey */
  --background-3: #e2d7cd;       /* Beige */
  --background-light: #ffffff;
  --background-dark: #484847;    /* Dark grey */

  /* Text colors */
  --text-1: #484847;
  --text-2: #818281;
  --text-3: #bfc0c0;
  --text-light: #ffffff;
  --text-dark: #484847;

  /* Accent colors (brand red family) */
  --accent-1: #ba2415;           /* Primary brand red */
  --accent-2: #D4734F;           /* Red light */
  --accent-3: #dd977a;           /* Red lighter */
  --accent-light: #e2d7cd;       /* Beige (warm light fill) */
  --accent-dark: #901C1D;        /* Crimson */

  /* Secondary colors (cool teal/petrol) */
  --secondary-1: #1D6E88;        /* Petrol */
  --secondary-2: #1F92A6;        /* Cyan */
  --secondary-3: #36b191;        /* Jade */
  --secondary-light: #ececec;    /* Very light grey */
  --secondary-dark: #1D6E88;     /* Petrol */

  /* Extra brand colors (not in standard token set) */
  --kpv-burgundy: #5a322b;
  --kpv-amber: #FFB31B;

  /* Status colors */
  --status-success: #1E9F49;     /* Emerald */
  --status-warning: #DD8028;     /* Tangerine */
  --status-error: #ba2415;       /* Brand red */
}

/* Typography */
.ai-label, .ai-text {
  font-family: 'Avenir LT Std', 'Avenir', 'Segoe UI', Roboto, Arial, sans-serif;
}

/* Shape defaults: rounded corners, softer stroke */
.ai-rect {
  rx: 4;
  ry: 4;
}

/* Opt-out for schematics / electronic symbols */
.schematic .ai-rect {
  rx: 0;
  ry: 0;
}

/* White labels on dark fills (adjacent sibling only) */
[fill="var(--accent-1)"] + .ai-label,
[fill="var(--accent-dark)"] + .ai-label,
[fill="var(--secondary-1)"] + .ai-label,
[fill="var(--secondary-2)"] + .ai-label,
[fill="var(--secondary-3)"] + .ai-label,
[fill="var(--secondary-dark)"] + .ai-label,
[fill="var(--foreground-1)"] + .ai-label,
[fill="var(--foreground-dark)"] + .ai-label {
  fill: var(--text-light);
}

  </style>
  <defs>
    <marker id="ai-arrow" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="4" markerHeight="4" markerUnits="strokeWidth" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="context-stroke"/>
    </marker>
  </defs>
  <g id="junction" class="ai-container">
    <g id="entry" class="ai-container">
      <circle id="entry_north" class="ai-shape ai-circle" cx="15" cy="15" r="5" fill="#4169E1" stroke="#333333" stroke-width="1.5"/>
      <circle id="entry_south" class="ai-shape ai-circle" cx="15" cy="55" r="5" fill="#4169E1" stroke="#333333" stroke-width="1.5"/>
    </g>
    <g id="junction_center" class="ai-container">
      <circle id="j1" class="ai-shape ai-circle" cx="125" cy="15" r="5" fill="#228B22" stroke="#333333" stroke-width="1.5"/>
      <text class="ai-label" x="125" y="-4.75" text-anchor="middle" dominant-baseline="middle"><tspan x="125" dy="-0"><tspan>Switch 1</tspan></tspan></text>
      <circle id="j2" class="ai-shape ai-circle" cx="125" cy="69" r="5" fill="#228B22" stroke="#333333" stroke-width="1.5"/>
      <text class="ai-label" x="125" y="49.25" text-anchor="middle" dominant-baseline="middle"><tspan x="125" dy="-0"><tspan>Switch 2</tspan></tspan></text>
      <circle id="j3" class="ai-shape ai-circle" cx="125" cy="123" r="5" fill="#228B22" stroke="#333333" stroke-width="1.5"/>
      <text class="ai-label" x="125" y="103.25" text-anchor="middle" dominant-baseline="middle"><tspan x="125" dy="-0"><tspan>Switch 3</tspan></tspan></text>
    </g>
    <g id="exit" class="ai-container">
      <circle id="exit_t1" class="ai-shape ai-circle" cx="235" cy="15" r="5" fill="#4169E1" stroke="#333333" stroke-width="1.5"/>
      <circle id="exit_t2" class="ai-shape ai-circle" cx="235" cy="45" r="5" fill="#4169E1" stroke="#333333" stroke-width="1.5"/>
      <circle id="exit_t3" class="ai-shape ai-circle" cx="235" cy="75" r="5" fill="#4169E1" stroke="#333333" stroke-width="1.5"/>
    </g>
  </g>
  <path class="ai-connection" d="M20 15 L109.2 15" fill="none" stroke="#4169E1" stroke-width="3" marker-end="url(#ai-arrow)"/>
  <path class="ai-connection" d="M19.25297284773019 57.629110487687754 L70 57.629110487687754 L70 120.37088951231225 L109.94702715226981 120.37088951231225" fill="none" stroke="#4169E1" stroke-width="3" marker-end="url(#ai-arrow)"/>
  <path class="ai-connection" d="M130 15 L222.8 15" fill="none" stroke="#228B22" stroke-width="2" marker-end="url(#ai-arrow)"/>
  <path class="ai-connection" d="M129.82381910618867 16.315587028960543 L223.22988138089966 41.789967649336276" fill="none" stroke="#228B22" stroke-width="2" marker-end="url(#ai-arrow)"/>
  <path class="ai-connection" d="M129.88507880704995 67.93416462391637 L223.0804077107981 47.60063831764405" fill="none" stroke="#228B22" stroke-width="2" marker-end="url(#ai-arrow)"/>
  <path class="ai-connection" d="M129.07866445537644 120.10785611346034 L225.04805872888147 52.05683108315678" fill="none" stroke="#228B22" stroke-width="2" marker-end="url(#ai-arrow)"/>
  <path class="ai-connection" d="M129.58269689184817 121.0002777199208 L223.81821958389048 79.87932236339324" fill="none" stroke="#228B22" stroke-width="2" marker-end="url(#ai-arrow)"/>
  <path class="ai-connection" d="M129.48833805280884 66.79663404680292 L180 66.79663404680292 L180 17.20336595319707 L226.91166194719116 17.20336595319707" fill="none" stroke="#555555" stroke-width="1" marker-end="url(#ai-arrow)"/>
</svg>
