  <style><![CDATA[
    :root {
    --accent-1: #2196f3;
    --accent-2: #e3f2fd;
    --accent-3: #bbdefb;
    --accent-dark: #1565c0;
    --accent-light: #e3f2fd;
    --background-1: #ffffff;
    --background-2: #f5f5f5;
