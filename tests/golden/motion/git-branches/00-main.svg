<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-size="14">
  <!-- agent-illustrator dev -->
  <style><![CDATA[
    @import url('https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;700;800&family=Overpass+Mono:wght@400;600&display=swap');
    :root {
    --accent-1: #2196f3;
    --accent-2: #e3f2fd;
    --accent-3: #bbdefb;
    --accent-dark: #1565c0;
    --accent-light: #e3f2fd;
    --background-1: #ffffff;
    --background-2: #f5f5f5;
    --background-3: #eeeeee;
    --background-dark: #333333;
    --background-light: #ffffff;
    --code-add: var(--role-ok);
    --code-add-bg: var(--role-ok-soft);
    --code-add-strong: var(--role-ok);
    --code-bg: var(--role-surface);
    --code-comment: var(--role-muted);
    --code-del: var(--role-error);
    --code-del-bg: var(--role-error-soft);
    --code-del-strong: var(--role-error);
    --code-frame: var(--role-ink);
    --code-function: var(--role-ink);
    --code-key: var(--role-primary);
    --code-keyword: var(--role-primary);
    --code-ln: var(--role-muted);
    --code-mark-bg: var(--role-warn-soft);
    --code-number: var(--role-ink);
    --code-plain: var(--role-ink);
    --code-string: var(--role-ok);
    --code-title: var(--role-ink);
    --code-title-bg: var(--role-surface-2);
    --font-mono: 'Overpass Mono', Consolas, monospace;
    --font-sans: 'Overpass', 'Segoe UI', Arial, sans-serif;
    --foreground-1: #333333;
    --foreground-2: #666666;
    --foreground-3: #999999;
    --foreground-dark: #1a1a1a;
    --foreground-light: #e0e0e0;
    --git-anna: #0E8A8A;
    --git-ben: #E07A12;
    --git-branch: #C92C76;
    --git-ink: #14171F;
    --git-lost: #D2382A;
    --git-lost-soft: #F6DEDB;
    --git-main: #2346D8;
    --git-muted: #5F6780;
    --git-ok: #1C9A5B;
    --git-ok-soft: #DDF1E6;
    --git-panel: #FFFFFF;
    --git-paper: #E9ECF0;
    --git-paper2: #F4F6F8;
    --git-rule: #CBD1DA;
    --git-warn: #F0B400;
    --role-backdrop: var(--git-paper);
    --role-error: var(--git-lost);
    --role-error-soft: var(--git-lost-soft);
    --role-ink: var(--git-ink);
    --role-muted: var(--git-muted);
    --role-ok: var(--git-ok);
    --role-ok-soft: var(--git-ok-soft);
    --role-primary: var(--git-main);
    --role-rule: var(--git-rule);
    --role-secondary: var(--git-branch);
    --role-series-1: var(--git-anna);
    --role-series-1-soft: #D2ECEC;
    --role-series-2: var(--git-ben);
    --role-series-2-soft: #FAE3CC;
    --role-series-3: #7b4bb7;
    --role-series-3-soft: #e8def3;
    --role-series-4: #c2185b;
    --role-series-4-soft: #f6d7e3;
    --role-surface: var(--git-panel);
    --role-surface-2: var(--git-paper2);
    --role-warn: var(--git-warn);
    --role-warn-soft: #FDF1C7;
    --secondary-1: #ff9800;
    --secondary-2: #fff3e0;
    --secondary-3: #ffe0b2;
    --secondary-dark: #e65100;
    --secondary-light: #fff3e0;
    --status-error: #f44336;
    --status-success: #4caf50;
    --status-warning: #ff9800;
    --text-1: #333333;
    --text-2: #666666;
    --text-3: #999999;
    --text-dark: #1a1a1a;
    --text-light: #ffffff;
  }
  .ai-on-dark { fill: var(--text-light); }
    /* git-deck.css */
/* Palette and type for the "git for non-git people" deck. */
:root {
  --git-paper: #E9ECF0;
  --git-paper2: #F4F6F8;
  --git-panel: #FFFFFF;
  --git-ink: #14171F;
  --git-muted: #5F6780;
  --git-rule: #CBD1DA;
  --git-main: #2346D8;
  /* Roles: the scenes and ail:motion/git use only these. */
  --role-primary: var(--git-main);
  --role-secondary: var(--git-branch);
  --role-ink: var(--git-ink);
  --role-muted: var(--git-muted);
  --role-rule: var(--git-rule);
  --role-surface: var(--git-panel);
  --role-surface-2: var(--git-paper2);
  --role-backdrop: var(--git-paper);
  --role-ok: var(--git-ok);
  --role-error: var(--git-lost);
  --role-warn: var(--git-warn);
  --role-ok-soft: var(--git-ok-soft);
  --role-error-soft: var(--git-lost-soft);
  --role-warn-soft: #FDF1C7;
  --role-series-1: var(--git-anna);
  --role-series-2: var(--git-ben);
  --role-series-1-soft: #D2ECEC;
  --role-series-2-soft: #FAE3CC;
  --git-branch: #C92C76;
  --git-anna: #0E8A8A;
  --git-ben: #E07A12;
  --git-lost: #D2382A;
  --git-warn: #F0B400;
  --git-ok: #1C9A5B;
  --git-ok-soft: #DDF1E6;
  --git-lost-soft: #F6DEDB;
  /* Retime the whole deck here. */
  --ail-motion-fast: .25s;
  --ail-motion-normal: .5s;
  --ail-motion-slow: .8s;
  /* Overpass Mono is a little wider than the usual 0.6em. */
  --ail-mono-advance: 0.616;
  --font-sans: 'Overpass', 'Segoe UI', Arial, sans-serif;
  --font-mono: 'Overpass Mono', Consolas, monospace;
}
/* Inherited, so a label's own font_family / font_weight still wins. */
svg { font-family: var(--font-sans); }
.dots { stroke-linecap: round; }
text { white-space: pre; }
  ]]></style>
