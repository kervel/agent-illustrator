  <text class="ai-label" x="123.7471" y="507.75" text-anchor="middle" dominant-baseline="middle" font-size="18" fill="var(--role-surface)" style="font-weight:600;font-family:var(--font-mono, ui-monospace, monospace)"><tspan x="123.7471" dy="-0"><tspan>main</tspan></tspan></text>
  <rect id="gate_top" class="ai-shape ai-rect ai-point" x="1380.9254" y="427.75" width="0" height="0" fill="none" stroke="none" stroke-width="1.5"/>
</svg>