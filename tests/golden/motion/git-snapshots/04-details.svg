    /* git-deck.css */
/* Palette and type for the "git for non-git people" deck. */
:root {
  --git-paper: #E9ECF0;
  --git-paper2: #F4F6F8;
  --git-panel: #FFFFFF;
  --git-ink: #14171F;
  --git-muted: #5F6780;
  --git-rule: #CBD1DA;
  --git-main: #2346D8;
  /* Roles: the scenes and ail:motion/git use only these. */
  --role-primary: var(--git-main);
  --role-secondary: var(--git-branch);
  --role-ink: var(--git-ink);
  --role-muted: var(--git-muted);
  --role-rule: var(--git-rule);
  --role-surface: var(--git-panel);
  --role-surface-2: var(--git-paper2);
  --role-backdrop: var(--git-paper);
  --role-ok: var(--git-ok);
  --role-error: var(--git-lost);
  --role-warn: var(--git-warn);
  --role-ok-soft: var(--git-ok-soft);
  --role-error-soft: var(--git-lost-soft);
  --role-warn-soft: #FDF1C7;
  --role-series-1: var(--git-anna);
  --role-series-2: var(--git-ben);
  --role-series-1-soft: #D2ECEC;
  --role-series-2-soft: #FAE3CC;
  --git-branch: #C92C76;
  --git-anna: #0E8A8A;
  --git-ben: #E07A12;
  --git-lost: #D2382A;
  --git-warn: #F0B400;
  --git-ok: #1C9A5B;
  --git-ok-soft: #DDF1E6;
  --git-lost-soft: #F6DEDB;
  /* Retime the whole deck here. */
  --ail-motion-fast: .25s;
  --ail-motion-normal: .5s;
  --ail-motion-slow: .8s;
  /* Overpass Mono is a little wider than the usual 0.6em. */
  --ail-mono-advance: 0.616;
  --font-sans: 'Overpass', 'Segoe UI', Arial, sans-serif;
  --font-mono: 'Overpass Mono', Consolas, monospace;
}
/* Inherited, so a label's own font_family / font_weight still wins. */
svg { font-family: var(--font-sans); }
.dots { stroke-linecap: round; }
text { white-space: pre; }
  ]]></style>
