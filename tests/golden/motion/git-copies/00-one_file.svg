          <path d="M94 1.5 V26 a6 6 0 0 0 6 6 H124.5 Z" fill="var(--role-rule, #cbd1da)"/>
          <path d="M94 1.5 V26 a6 6 0 0 0 6 6 H124.5" fill="none" stroke="var(--role-ink, #14171f)"
          stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
          </g>
        </g>
        <g id="d0_pg_bars" class="ai-container">
          <g id="d0_pg_bar1" class="ai-svg-embed" transform="translate(756.702, 414.625) scale(1, 1) translate(-17, -40)" stroke="var(--b1, var(--role-rule, #cbd1da))">
            <g stroke-width="9" stroke-linecap="round"><line id="d0_pg__bar1" x1="21.5" y1="44.5" x2="100.5" y2="44.5" stroke="inherit"/></g>
          </g>
          <g id="d0_pg_bar2" class="ai-svg-embed" transform="translate(756.702, 435.625) scale(1, 1) translate(-17, -61)" stroke="var(--b2, var(--role-rule, #cbd1da))">
            <g stroke-width="9" stroke-linecap="round"><line id="d0_pg__bar2" x1="21.5" y1="65.5" x2="82.5" y2="65.5" stroke="inherit"/></g>
          </g>
          <g id="d0_pg_bar3" class="ai-svg-embed" transform="translate(756.702, 456.625) scale(1, 1) translate(-17, -82)" stroke="var(--b3, var(--role-rule, #cbd1da))">
            <g stroke-width="9" stroke-linecap="round"><line id="d0_pg__bar3" x1="21.5" y1="86.5" x2="67.5" y2="86.5" stroke="inherit"/></g>
          </g>
          <g id="d0_pg_bar4" class="ai-svg-embed" transform="translate(756.702, 477.625) scale(1, 1) translate(-17, -103)" stroke="var(--b4, var(--role-rule, #cbd1da))">
            <g stroke-width="9" stroke-linecap="round"><line id="d0_pg__bar4" x1="21.5" y1="107.5" x2="82.5" y2="107.5" stroke="inherit"/></g>
          </g>
          <g id="d0_pg_bar5" class="ai-svg-embed" transform="translate(756.702, 498.625) scale(1, 1) translate(-17, -124)" stroke="var(--b5, var(--role-rule, #cbd1da))">
            <g stroke-width="9" stroke-linecap="round"><line id="d0_pg__bar5" x1="21.5" y1="128.5" x2="100.5" y2="128.5" stroke="inherit"/></g>
          </g>
          <g id="d0_pg_bar6" class="ai-svg-embed" transform="translate(756.702, 519.625) scale(1, 1) translate(-17, -145)" stroke="var(--b6, var(--role-rule, #cbd1da))">
            <g stroke-width="9" stroke-linecap="round"><line id="d0_pg__bar6" x1="21.5" y1="149.5" x2="67.5" y2="149.5" stroke="inherit"/></g>
          </g>
        </g>
      </g>
      <rect id="d0_name" class="ai-shape ai-rect" x="737.106" y="548.625" width="131.192" height="37.25" fill="none" stroke="none" stroke-width="1.5"/>
      <text class="ai-label" x="802.702" y="567.25" text-anchor="middle" dominant-baseline="middle" font-size="17" fill="var(--role-ink)" style="font-family:var(--font-mono, ui-monospace, monospace)"><tspan x="802.702" dy="-0"><tspan>report.docx</tspan></tspan></text>
    </g>
  </g>
  <g id="codes" class="ai-container">
