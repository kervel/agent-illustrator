    <rect id="s_badge" class="ai-shape ai-rect" x="96" y="64" width="66" height="66" fill="var(--role-ink)" stroke="none" stroke-width="1.5" rx="16" style="rx:16px;ry:16px"/>
    <text class="ai-label" x="129" y="97" text-anchor="middle" dominant-baseline="middle" font-size="38" fill="var(--role-backdrop)" style="font-weight:800"><tspan x="129" dy="-0"><tspan>1</tspan></tspan></text>
    <text id="s_heading" class="ai-shape ai-text" x="184" y="97" text-anchor="start" dominant-baseline="middle" font-size="60" fill="var(--role-ink)" style="font-weight:800">Sound familiar?</text>
  </g>
  <g id="docs" class="ai-container">
    <g id="d0" class="ai-container">
      <g id="d0_pg" class="ai-container">
        <g id="d0_pg_art" class="ai-svg-embed" transform="translate(741.202, 376.125) scale(1, 1) translate(-1.5, -1.5)">
          <title>Document</title>
          <!-- Parts (ids) are addressable from AIL: d.sheet, d.fold, d.bars, d.bar1..bar6.
          Colours are theme roles; the CSS variables b1 to b6 are instance arguments.
          The sheet has its corner cut off, so the background shows behind the fold. -->
        </g>
        <g id="d0_pg_sheet" class="ai-svg-embed" transform="translate(739.702, 374.625) scale(1, 1) translate(0.00000095367431640625, 0.00000095367431640625)" fill="var(--role-surface, #ffffff)" stroke="var(--role-ink, #14171f)">
          <path id="d0_pg__sheet" d="M9.5 1.5 H94 L124.5 32 V152.5 a8 8 0 0 1 -8 8 H9.5 a8 8 0 0 1 -8 -8 V9.5 a8 8 0 0 1 8 -8 Z" stroke-width="3" stroke-linejoin="round" fill="inherit" stroke="inherit"/>
        </g>
        <g id="d0_pg_fold" class="ai-svg-embed" transform="translate(832.202, 374.625) scale(1, 1) translate(-92.5, -0)">
