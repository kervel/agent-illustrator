    <rect id="merged_line8" class="ai-shape ai-rect" x="495.5" y="529" width="609" height="40" fill="var(--role-series-1-soft)" stroke="none" stroke-width="1.5"/>
    <text class="ai-label" x="503.5" y="549" text-anchor="start" dominant-baseline="middle" font-size="24" fill="var(--code-plain)" style="font-family:var(--font-mono, ui-monospace, monospace)"><tspan x="503.5" dy="-0"><tspan font-size="19.200000000000003" fill="var(--code-ln)">8  </tspan><tspan>    </tspan><tspan fill="var(--code-keyword)">return</tspan><tspan> </tspan><tspan fill="var(--code-number)">0</tspan><tspan> </tspan><tspan fill="var(--code-keyword)">if</tspan><tspan> total &gt; </tspan><tspan fill="var(--code-number)">40</tspan><tspan> </tspan><tspan fill="var(--code-keyword)">else</tspan><tspan> </tspan><tspan fill="var(--code-number)">4</tspan><tspan>.</tspan><tspan fill="var(--code-number)">95</tspan></tspan></text>
