<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-size="14">
  <!-- agent-illustrator dev -->
  <style><![CDATA[
    @import url('https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;700;800&family=Overpass+Mono:wght@400;600&display=swap');
    :root {
    --accent-1: #2196f3;
    --accent-2: #e3f2fd;
    --accent-3: #bbdefb;
    --accent-dark: #1565c0;
    --accent-light: #e3f2fd;
    --background-1: #ffffff;
    --background-2: #f5f5f5;
    --background-3: #eeeeee;
    --background-dark: #333333;
    --background-light: #ffffff;
    --code-add: var(--role-ok);
    --code-add-bg: var(--role-ok-soft);
    --code-add-strong: var(--role-ok);
    --code-bg: var(--role-surface);
    --code-comment: var(--role-muted);
    --code-del: var(--role-error);
    --code-del-bg: var(--role-error-soft);
    --code-del-strong: var(--role-error);
    --code-frame: var(--role-ink);
    --code-function: var(--role-ink);
    --code-key: var(--role-primary);
    --code-keyword: var(--role-primary);
