<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <title>Agent</title>
  <!-- An AI agent: a friendly robot head. Parts: agent.head, agent.eyes, agent.antenna. -->
  <g id="antenna">
    <line x1="48" y1="20" x2="48" y2="8" stroke="var(--role-ink, #14171f)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="48" cy="7" r="5.5" fill="var(--tint, var(--role-primary, #1d6e88))" stroke="var(--role-ink, #14171f)" stroke-width="3"/>
  </g>
  <rect id="head" x="10.5" y="20.5" width="75" height="62" rx="16"
        fill="var(--role-surface, #ffffff)" stroke="var(--role-ink, #14171f)" stroke-width="3"/>
  <rect x="3" y="42" width="8" height="20" rx="3" fill="var(--role-ink, #14171f)"/>
  <rect x="85" y="42" width="8" height="20" rx="3" fill="var(--role-ink, #14171f)"/>
  <g id="eyes" fill="var(--tint, var(--role-primary, #1d6e88))">
    <circle cx="34" cy="47" r="7"/>
    <circle cx="62" cy="47" r="7"/>
  </g>
  <path d="M34 66 Q48 74 62 66" fill="none" stroke="var(--role-ink, #14171f)" stroke-width="3" stroke-linecap="round"/>
</svg>
