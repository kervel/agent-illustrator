name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The release binary must stay a single static executable that gives an
  # agent the whole author-and-verify loop (lint, --states, PNG stills) with
  # nothing else installed.
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --target x86_64-unknown-linux-musl
      - name: Static binary, no browser, whole loop
        run: |
          BIN=$PWD/target/x86_64-unknown-linux-musl/release/agent-illustrator
          file $BIN | grep -Eq 'static(ally|-pie)? linked' || { file $BIN; echo "not a static binary"; exit 1; }
          mkdir /tmp/w && cp $BIN examples/motion/git-history.ail examples/motion/git-deck.ail examples/motion/git-deck.css /tmp/w/
          docker run --rm --network none -v /tmp/w:/w -w /w alpine:latest sh -c '
            set -e
            ./agent-illustrator --lint git-history.ail
            ./agent-illustrator --states git-history.ail > /dev/null
            ./agent-illustrator --stylesheet-css git-deck.css --frames-to-dir frames --png git-history.ail
            ./agent-illustrator --stylesheet-css git-deck.css --frame push --at 50% --png -o mid.png git-history.ail
            test -s mid.png && ls frames/*.png'

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
