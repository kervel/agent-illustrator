name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          # Linux binaries are static (musl): they run in any container or
          # sandbox, with nothing else installed.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: agent-illustrator-linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            artifact: agent-illustrator-linux-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: agent-illustrator-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: agent-illustrator-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: agent-illustrator-windows-x86_64.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
        env:
          # The tag is the version. Cargo.toml is not authoritative.
          AI_RELEASE_VERSION: ${{ github.ref_name }}

      - name: Static, and the whole loop works (Linux)
        if: runner.os == 'Linux'
        run: |
          BIN=target/${{ matrix.target }}/release/agent-illustrator
          file $BIN
          file $BIN | grep -Eq 'static(ally|-pie)? linked' || { echo "not a static binary"; exit 1; }
          cd examples/motion
          ../../$BIN --lint git-history.ail
          ../../$BIN --stylesheet-css git-deck.css --frame push --at 50% --png -o /tmp/still.png git-history.ail
          test -s /tmp/still.png

      - name: Rename binary (Unix)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/agent-illustrator ${{ matrix.artifact }}

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/agent-illustrator.exe ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/*/*
          generate_release_notes: true
