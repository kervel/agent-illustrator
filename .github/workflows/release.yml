name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          # Linux binaries are static (musl): they run in any container or
          # sandbox, with nothing else installed.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: agent-illustrator-linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            artifact: agent-illustrator-linux-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: agent-illustrator-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: agent-illustrator-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: agent-illustrator-windows-x86_64.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
        env:
          # The tag is the version. Cargo.toml is not authoritative.
          AI_RELEASE_VERSION: ${{ github.ref_name }}

      - name: Static, and the whole loop works (Linux)
        if: runner.os == 'Linux'
        run: |
          BIN=target/${{ matrix.target }}/release/agent-illustrator
          file $BIN
          file $BIN | grep -Eq 'static(ally|-pie)? linked' || { echo "not a static binary"; exit 1; }
          cd examples/motion
          ../../$BIN --lint git-history.ail
          ../../$BIN --stylesheet-css git-deck.css --frame push --at 50% --png -o /tmp/still.png git-history.ail
          test -s /tmp/still.png

      - name: Rename binary (Unix)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/agent-illustrator ${{ matrix.artifact }}

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/agent-illustrator.exe ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  # The WebAssembly build: the npm package (attached to the release) and
  # the playground (deployed to GitHub Pages).
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # Not jetli/wasm-pack-action: on the Ubuntu 26 runners its rename from
      # /tmp into ~/.cargo/bin fails with EXDEV (cross-device link).
      - name: Install wasm-pack
        run: |
          curl -sSfL https://github.com/rustwasm/wasm-pack/releases/download/v0.15.0/wasm-pack-v0.15.0-x86_64-unknown-linux-musl.tar.gz \
            | tar xz --strip-components=1 -C ~/.cargo/bin --wildcards '*/wasm-pack'
          wasm-pack --version

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build and test the wasm package
        working-directory: wasm
        env:
          AI_RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          npm ci
          npm run build
          npm test
          npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version
          npm pack
          mv agent-illustrator-wasm-*.tgz ../agent-illustrator-wasm.tgz

      - name: Build the playground
        working-directory: playground
        run: |
          npm ci
          npm run build

      - name: Upload the npm package
        uses: actions/upload-artifact@v4
        with:
          name: agent-illustrator-wasm.tgz
          path: agent-illustrator-wasm.tgz

      - name: Upload the playground
        uses: actions/upload-pages-artifact@v3
        with:
          path: playground/dist

  release:
    needs: [build, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          # Not the playground: that goes to Pages.
          pattern: agent-illustrator-*

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/*/*
          generate_release_notes: true

  playground:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
